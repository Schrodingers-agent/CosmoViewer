name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash          # Git Bash on Windows, so every step reads the same on all three systems
    steps:
      - uses: actions/checkout@v4

      - name: No oversized files
        if: runner.os == 'Linux'
        run: |
          big=$(git ls-files -z | xargs -0 find 2>/dev/null -maxdepth 0 -type f -size +5M)
          if [ -n "$big" ]; then echo "Files over 5 MB:"; echo "$big"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3

      # The movie encoders are optional for users (README, step 4) but installed here,
      # so the GIF and MP4 tests run instead of failing or skipping.
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyQt6>=6.5" "pyqtgraph>=0.13" "PyOpenGL>=3.1" "numpy>=1.24" \
                                "h5py>=3.8" "scipy>=1.10" "astropy>=5.0" pytest \
                                Pillow opencv-python-headless imageio-ffmpeg
          python -m pip list

      - name: Immersive Mode tests
        working-directory: Cosmoviewer Immersive
        run: python -m pytest tests -q -p no:cacheprovider -rs

      - name: Dataset Explorer tests
        working-directory: Dataset Explorer
        run: python -m pytest -q -p no:cacheprovider -rs

      # The same script a new user runs after cloning, minus the .venv (packages are installed above).
      # Offscreen, so the window is rendered but the 3D particle check is skipped (no OpenGL).
      - name: Fresh-clone script
        run: python tools/first_run.py --no-venv --offscreen

      - name: Keep the fresh-clone log and picture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-run-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            first_run.log
            first_render.png
          if-no-files-found: ignore
